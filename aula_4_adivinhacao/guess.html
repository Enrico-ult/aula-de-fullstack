<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <title>Adivinhação</title>
</head>
<body id="advinhar">

    <div class="card">
        <h1>Adivinhe o <span>número</span></h1>
        <p class="range">de 0 a 100</p>
        <div  class="home">
            <a href="../aula_2_laboratorio/projects.html">Home</a>
        </div>
        <div class="input-row">
            <input
                type="number"
                id="numerodigitado"
                min="0" max="100"
                placeholder="—"
                autocomplete="off"
                onkeydown="if(event.key==='Enter') Adivinhar()"
            >
            <button id="Botao" onclick="Adivinhar()">OK</button>
        </div>

        <p id="mensagem" class="mensagem">—</p>

        <p class="tentativas">tentativas: <span id="contagem">0</span></p>

        <button id="resetBtn" onclick="Resetar()">jogar de novo</button>
    </div>

    <script src="sla.js"></script>
</body>
</html>
